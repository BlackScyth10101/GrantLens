services:
  db:
    image: postgres:16-alpine
    container_name: grantlens_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grantlens_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_grant_pwd_962}
      POSTGRES_DB: ${POSTGRES_DB:-grantlens_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grantlens_admin} -d ${POSTGRES_DB:-grantlens_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - grantlens_network

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grantlens_fastapi_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - upload_cache:/app/storage/uploads
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-grantlens_admin}:${POSTGRES_PASSWORD:-secure_grant_pwd_962}@db:5432/${POSTGRES_DB:-grantlens_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - UPLOAD_DIRECTORY=/app/storage/uploads
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy
    networks:
      - grantlens_network

volumes:
  pg_data:
    driver: local
  upload_cache:
    driver: local

networks:
  grantlens_network:
    driver: bridge
